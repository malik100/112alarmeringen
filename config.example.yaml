# Buurtradar – kopieer naar config.yaml en pas aan.
# Alles wat je weglaat krijgt de standaardwaarde (zie app/sirene/config.py).

# Wachtwoord voor de hele app. Leeg = open (prima op je thuisnetwerk). Liever in .env:
# BUURTRADAR_PASSWORD=...
access:
  password: ""

# Straal rond jouw locatie in meters: voor de lijst "in de buurt" en voor meldingen.
radius_m: 1000

p2000:
  # Landelijke feed. Wil je alleen je eigen regio, gebruik dan bijvoorbeeld
  # https://alarmeringen.nl/feeds/region/amsterdam-amstelland.rss
  feeds:
    - https://alarmeringen.nl/feeds/all.rss
  poll_interval_s: 60   # niet vaker: de feed ververst ongeveer elke minuut
  keep_hours: 24        # hoe lang incidenten bewaard blijven

location:
  homeassistant:
    enabled: false      # zet op true en vul HA_URL/HA_TOKEN/HA_ENTITY_ID in .env
    poll_interval_s: 15
  # Laat de webkaart de locatie van je telefoon/laptop doorgeven (vereist HTTPS).
  browser: true
  # Vaste terugvallocatie (bijv. thuis) zolang er geen live locatie is.
  fallback:
    lat: null
    lon: null
  max_age_min: 30       # oudere locaties tellen niet mee voor meldingen

speedcams:
  enabled: true
  refresh_hours: 24

statiegeld:
  enabled: true
  refresh_hours: 24
  min_zoom: 12          # pas vanaf dit zoomniveau punten op de kaart tonen
  list_radius_m: 2000   # straal voor de lijst "statiegeld in de buurt"

news:
  enabled: true
  poll_interval_s: 300  # elke 5 minuten
  keep_hours: 48        # hoe lang artikelen bewaard blijven
  local_radius_m: 5000  # "nieuws uit je buurt": artikelen die een plaats binnen deze straal noemen
  # Eigen lijst? Dan vervangt die de standaardlijst (zie app/sirene/config.py), bijv.:
  # feeds:
  #   - {name: NH Nieuws, url: "https://rss.nhnieuws.nl/rss"}
  #   - {name: NOS, url: "https://feeds.nos.nl/nosnieuwsbinnenland"}

announcements:          # bekendmakingen van je gemeente (overheid.nl)
  enabled: true
  refresh_minutes: 60
  days: 30
  radius_m: 1500

roadworks:              # wegwerkzaamheden en afsluitingen (NDW/Melvin)
  enabled: true
  refresh_minutes: 120  # ~17 MB per keer; ongewijzigd = niet opnieuw downloaden
  ahead_days: 14        # "Ook gepland": werk dat binnen zoveel dagen begint
  min_zoom: 12
  list_radius_m: 3000

ov:                     # openbaar vervoer (OVapi/NDOV Loket)
  enabled: true         # ~250 MB download per dag, ~450 MB op schijf (ov.db naast de database)
  days: 7               # zoveel dagen vooruit inlezen
  realtime_interval_s: 30  # actuele tijden/voertuigen: hooguit zo vaak, alleen als iemand kijkt
  stops_min_zoom: 15
  lines_min_zoom: 13
  vehicles_min_zoom: 14
  list_radius_m: 800    # straal voor "haltes in de buurt"

shops:
  enabled: true
  refresh_hours: 24
  min_zoom: 13
  list_radius_m: 1500   # straal voor de lijst "boodschappen in de buurt"

fuel:                   # tankstations (OSM), met of zonder winkel
  enabled: true
  refresh_hours: 24
  min_zoom: 12
  list_radius_m: 5000   # straal voor de lijst "tankstations in de buurt"

history:                # afgelopen week: per dag vastleggen wat er rond je plek gebeurde
  enabled: true
  days: 7

waste:                  # afvalkalender: agenda-link (iCal) van je gemeente; kan ook in het paneel
  enabled: true
  ical_url: ""
  refresh_hours: 24

weather:                # weer en buien (Buienradar), luchtkwaliteit (Luchtmeetnet/RIVM)
  enabled: true
  refresh_minutes: 10
  air_refresh_minutes: 60

amenities:              # AED's, openbare toiletten, drinkwaterpunten (OSM)
  enabled: true
  refresh_hours: 24
  min_zoom: 14
  list_radius_m: 1500

charging:
  enabled: true
  refresh_hours: 24         # details: stekkers, tarieven, toegang
  status_interval_s: 900    # beschikbaarheid: elke 15 min (~470 MB/dag); 1800 = helft
  min_zoom: 13
  list_radius_m: 3000

parking:
  enabled: true
  refresh_hours: 24
  min_zoom: 13          # pas vanaf dit zoomniveau zones op de kaart tonen

map:
  # Standaard OpenStreetMap-tegels. De tegelserver ziet welk kaartgebied je bekijkt,
  # niet je locatie of de incidenten. Later kun je hier een eigen tegelserver invullen.
  tile_url: https://tile.openstreetmap.org/{z}/{x}/{y}.png
  attribution: "&copy; OpenStreetMap-bijdragers"
  default_window_minutes: 120

notifications:
  enabled: false        # optioneel: zet op true voor pushmeldingen
  channel: homeassistant   # of: ntfy
  only_priority_1: true    # alleen incidenten met sirene (A0/A1/P1)
  min_precision: straat    # postcode | straat | plaats
  roadworks: true          # ook: afsluiting in de buurt die nu of binnen 2 dagen begint
  announcements: true      # ook: belangrijke bekendmaking binnen radius_m
  waste: true              # ook: 's avonds wat morgen aan de straat moet
  waste_hour: 19
  homeassistant_service: notify.mobile_app_telefoon
  ntfy:
    url: http://ntfy
    topic: buurtradar
