<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>Buurtradar – nieuwe kaart (proef)</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/vendor/maplibre/maplibre-gl.css">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/proef.css">
</head>
<body>
  <div id="map" aria-label="Kaart van je buurt"></div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-dot ok" aria-hidden="true"></span>
      <h1>Buurtradar</h1>
    </div>
    <span class="pill proef-pill">Proef: nieuwe kaart · <a href="/">terug</a></span>
  </header>

  <aside class="layers" id="layers" aria-label="Kaartlagen">
    <button type="button" class="layers-head" id="layers-toggle" aria-expanded="true" aria-controls="layers-body">
      <svg class="i" aria-hidden="true"><use href="/static/icons.svg#layers"/></svg><span>Kaartlagen</span><svg class="i caret" aria-hidden="true"><use href="/static/icons.svg#chevron-down"/></svg>
    </button>
    <div class="layers-body" id="layers-body">
      <label class="layer-row"><span class="layer-ic"><svg class="i" aria-hidden="true"><use href="/static/icons.svg#square-parking"/></svg></span><span class="layer-name">Parkeerzones &amp; tarieven</span><input type="checkbox" class="toggle" data-layer="parking" checked></label>
      <label class="layer-row"><span class="layer-ic"><svg class="i" aria-hidden="true"><use href="/static/icons.svg#recycle"/></svg></span><span class="layer-name">Statiegeld-inleverpunten</span><input type="checkbox" class="toggle" data-layer="statiegeld"></label>
      <label class="layer-row"><span class="layer-ic"><svg class="i" aria-hidden="true"><use href="/static/icons.svg#shopping-cart"/></svg></span><span class="layer-name">Supermarkten &amp; avondwinkels</span><input type="checkbox" class="toggle" data-layer="shops"></label>
      <label class="layer-row"><span class="layer-ic"><svg class="i" aria-hidden="true"><use href="/static/icons.svg#construction"/></svg></span><span class="layer-name">Wegwerkzaamheden</span><input type="checkbox" class="toggle" data-layer="roadworks"></label>
      <label class="layer-row"><span class="layer-ic"><svg class="i" aria-hidden="true"><use href="/static/icons.svg#camera"/></svg></span><span class="layer-name">Flitsers &amp; trajectcontroles</span><input type="checkbox" class="toggle" data-layer="cams"></label>
      <p class="proef-note">Draaien: rechtermuisknop slepen of twee vingers draaien. Kantelen: Ctrl + slepen of twee vingers omhoog.
        Het kompas zet het noorden weer boven.</p>
    </div>
  </aside>

  <div id="zoom-hint" class="zoom-hint" role="status" hidden>
    <span id="zoom-hint-text"></span>
    <button type="button" id="zoom-hint-btn">Inzoomen</button>
  </div>

  <script src="/static/vendor/maplibre/maplibre-gl.js"></script>
  <script src="/static/openinghours.js"></script>
  <script src="/static/parking.js"></script>
  <script src="/static/nav.js"></script>
  <script src="/static/proef.js"></script>
</body>
</html>
